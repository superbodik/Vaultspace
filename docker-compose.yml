services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultspace
      POSTGRES_PASSWORD: vaultspace
      POSTGRES_DB: vaultspace
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultspace"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vaultspace:vaultspace@db:5432/vaultspace
      PORT: "4000"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: ./uploads
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:5173}
      # seeds the demo account/data room on first boot; safe to leave on, the
      # seed script no-ops once it detects it has already run
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - api_uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  db_data:
  api_uploads:
