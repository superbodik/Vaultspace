server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: let the client-side router (react-router) handle every path.
    # index.html must never be cached — it's what points at the current
    # hashed bundle, so a stale cached copy sends browsers to JS that no
    # longer exists on disk after the next deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed filenames (index-<hash>.js) mean a new deploy is a new URL, so
    # these can be cached as aggressively as possible.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
